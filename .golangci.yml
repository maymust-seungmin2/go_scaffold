version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    # Correctness / bugs
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Style / maintainability
    - revive

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    revive:
      severity: warning
      rules:
        - name: var-naming
        - name: indent-error-flow
        - name: error-return
        - name: duplicated-imports
        - name: unused-parameter

  exclusions:
    generated: lax
    paths:
      # sqlc generated code
      - internal/store/query

formatters:
  enable:
    - gofmt
    - goimports

  exclusions:
    paths:
      # sqlc generated code
      - internal/store/query

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
